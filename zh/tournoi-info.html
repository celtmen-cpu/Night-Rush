    <script>
        const SUPABASE_URL = "https://gcybobosgzsqnjvqvuqz.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjeWJvYm9zZ3pzcW5qdnF2dXF6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg5NDQ2MDEsImV4cCI6MjA5NDUyMDYwMX0.-qQN69mtVW_o1XKyq1bWZ1I5FPVVKIZfHC4fS-qnQOE";
        async function fetchLeaderboard() {
            const tbody = document.getElementById('leaderboard-body');
            const targetUrl = `${SUPABASE_URL}/rest/v1/profiles?select=pseudo,best_score&order=best_score.desc`;
            try {
                const response = await fetch(targetUrl, {
                    method: 'GET',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    }
                });
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(`Supabase 错误: ${errorData.message || response.statusText} (${errorData.hint || '无提示'})`);
                }
                const profiles = await response.json();
                if (!profiles || profiles.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: #fbbf24;">当前没有注册的玩家。</td></tr>`;
                    return;
                }
                tbody.innerHTML = "";
                profiles.forEach((profile, index) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `<td><strong>${index + 1}</strong></td><td>${profile.pseudo || '匿名玩家'}</td><td>${profile.best_score !== null && profile.best_score !== undefined ? profile.best_score : 0} pts</td>`;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error("问题详情:", error);
                tbody.innerHTML = `<tr><td colspan="3" style="color: #ef4444; text-align: center; font-weight: bold;">⚠️ ${error.message}</td></tr>`;
            }
        }
        document.addEventListener('DOMContentLoaded', fetchLeaderboard);
    </script>
